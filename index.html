<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eeece8">
<title>Flowdeck - project management</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <div class="device" id="device">
    <div class="notch"></div>
    <div class="statusbar"><span>9:41</span><span class="sb-r">&#9679;&#9679;&#9679; &#9650; &#9646;</span></div>
    <main id="screen" class="screen"></main>
    <nav class="tabbar" id="tabbar">
      <button data-tab="home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
      <button data-tab="stats" aria-label="Performance"><svg viewBox="0 0 24 24"><path d="M12 3v9h9a9 9 0 1 1-9-9z"/></svg></button>
      <button data-tab="schedule" aria-label="Schedule"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
      <button data-tab="projects" aria-label="Projects"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
      <button class="fab" id="fab" aria-label="New task"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </nav>
    <div class="sheet-wrap" id="sheetWrap" hidden>
      <div class="scrim" id="scrim"></div>
      <form class="sheet" id="sheet" autocomplete="off"></form>
    </div>
    <div class="toast" id="toast"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
