<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-RU1rVRTQP2C/4dwAQIOFLtAJW4SiKRqcEDhPgK5KF7Y='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#eeece8">
<meta name="description" content="FlowDeck — a fast, private, local-first project manager with natural-language quick add, a drag-and-drop board, auto-scheduling and focus tracking.">
<title>FlowDeck — project management</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<script>try{var t=JSON.parse(localStorage.getItem('flowdeck.v2')||'{}').theme;if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="stage">
  <div class="device" id="device">
    <div class="notch"></div>
    <div class="statusbar"><span>9:41</span><span class="sb-r">&#9679;&#9679;&#9679; &#9650; &#9646;</span></div>
    <main id="screen" class="screen" aria-live="polite"></main>
    <nav class="tabbar" id="tabbar" aria-label="Main">
      <span class="brand" aria-hidden="true"><img src="icon.svg" alt=""></span>
      <button data-tab="home" aria-label="Home" title="Home (1)"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
      <button data-tab="board" aria-label="Board" title="Board (2)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/></svg></button>
      <button data-tab="schedule" aria-label="Schedule" title="Schedule (3)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
      <button data-tab="stats" aria-label="Performance" title="Performance (4)"><svg viewBox="0 0 24 24"><path d="M12 3v9h9a9 9 0 1 1-9-9z"/></svg></button>
      <button data-tab="projects" aria-label="Projects and settings" title="Projects & settings (5)"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></svg></button>
      <button class="fab" id="fab" aria-label="New task" title="New task (N)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </nav>
    <div class="timer" id="timer" hidden>
      <button data-tpause aria-label="Pause focus"></button>
      <button class="tm" data-topen aria-label="Open focused task"><b id="tmClock">25:00</b><small id="tmTask"></small></button>
      <button data-tstop aria-label="Stop and log focus"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
    </div>
    <div class="sheet-wrap" id="sheetWrap" hidden>
      <div class="scrim" id="scrim"></div>
      <form class="sheet" id="sheet" autocomplete="off" novalidate></form>
    </div>
    <div class="pal-wrap" id="palWrap" hidden>
      <div class="scrim" data-palclose></div>
      <div class="pal" role="dialog" aria-modal="true" aria-label="Command palette">
        <div class="pal-in"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="palIn" placeholder="Type a task, or search…" autocomplete="off" spellcheck="false" aria-label="Command or task"><kbd>esc</kbd></div>
        <div class="pal-list" id="palList" role="listbox"></div>
        <div class="pal-foot"><span><kbd>↑↓</kbd> move</span><span><kbd>↵</kbd> run</span><span><kbd>⇧↵</kbd> edit details</span><span class="hidesm">try: <code>call Leo fri 3pm #design !high</code></span></div>
      </div>
    </div>
    <div class="toast" id="toast" role="status"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
